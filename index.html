
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahmoud Ghanem | Software Project Manager</title>
<meta name="description" content="Software Project Manager specializing in requirements, delivery planning, team coordination, and project optimization.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0A0F1C;
  --card:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.1);
  --ink:#EAF0FA;
  --muted:#93A1B7;
  --accent:#38BDF8;
  --a2:#8B5CF6;
  --grad:linear-gradient(135deg,var(--accent),var(--a2));
  --header-height:64px;
}


*{box-sizing:border-box;margin:0}

html{
  scroll-behavior:smooth;
  scroll-snap-type:y proximity;
  scroll-padding-top:var(--header-height);
}

body{
  font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.65;
  font-size:1.0625rem;
  background-image:
    radial-gradient(700px 400px at 85% -5%,rgba(139,92,246,.22),transparent),
    radial-gradient(600px 380px at 5% 5%,rgba(56,189,248,.14),transparent);
  background-repeat:no-repeat;
}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}

:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px;
  border-radius:6px;
}

.wrap{
  max-width:1040px;
  margin:0 auto;
  padding:0 24px;
}

/* Header */

header{
  position:sticky;
  top:0;
  z-index:20;
  height:var(--header-height);
  background:rgba(10,15,28,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

header .wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:var(--header-height);
  gap:16px;
}

.brand{
  font-weight:700;
  white-space:nowrap;
}

nav{
  display:flex;
  gap:20px;
  align-items:center;
  font-size:.92rem;
  color:var(--muted);
}

nav a{transition:color .2s}
nav a:hover,nav a:focus-visible{color:var(--ink)}

#lang{
  background:none;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 14px;
  font-size:.9rem;
  white-space:nowrap;
}

#lang:hover{border-color:var(--accent)}

/* Buttons */

.btn{
  display:inline-block;
  padding:10px 20px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--card);
  font-weight:500;
  text-align:center;
  transition:border-color .2s,transform .2s;
}

.btn:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}

.btn.p{
  background:var(--grad);
  border-color:transparent;
  color:#07101F;
  font-weight:600;
}

/* Sections: content starts at the top */

main>section.panel{
  min-height:calc(100vh - var(--header-height));
  min-height:calc(100svh - var(--header-height));
  scroll-snap-align:start;
  scroll-margin-top:var(--header-height);
  padding:32px 0 24px;
  display:block;
}

.panel>.wrap{width:100%}

.panel-heading{margin-bottom:24px}

h2{
  font-size:clamp(1.5rem,3vw,2rem);
  font-weight:700;
  line-height:1.4;
}

.sub{
  color:var(--muted);
  margin-top:8px;
  max-width:65ch;
}

/* Hero */

.hero{
  display:grid;
  grid-template-columns:minmax(0,1fr) 280px;
  gap:48px;
  align-items:center;
}

.role{
  color:var(--accent);
  font-weight:600;
  margin-bottom:12px;
}

h1{
  font-size:clamp(2.1rem,5vw,3.3rem);
  line-height:1.2;
  font-weight:700;
  letter-spacing:-.02em;
  max-width:18ch;
}

html[lang="ar"] h1{
  letter-spacing:0;
  line-height:1.5;
  max-width:22ch;
}

.lead{
  margin-top:20px;
  color:var(--muted);
  max-width:58ch;
}

.cta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:28px;
}

.photo{
  padding:3px;
  border-radius:24px;
  background:var(--grad);
  width:100%;
  max-width:300px;
  aspect-ratio:4/5;
  justify-self:end;
  overflow:hidden;
}

.photo img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 35%;
  border-radius:21px;
}

/* Statistics */

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-top:24px;
}

.stat{
  padding:18px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
}

.stat b{
  display:block;
  font-size:clamp(1.5rem,3vw,2rem);
  line-height:1.3;
  background:var(--grad);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.stat span{
  color:var(--muted);
  font-size:.85rem;
}

.stat b {
  display: block;
  font-size: 1rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

@media (max-width: 640px) {
  .stat b {
    font-size: 0.9rem;
  }
}

.stat {
  transition: transform 0.25s ease, border-color 0.25s ease,
              box-shadow 0.25s ease;
}

.stat:hover {
  transform: translateY(-5px);
  border-color: var(--accent);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
}

@media (prefers-reduced-motion: reduce) {
  .stat {
    transition: none;
  }

  .stat:hover {
    transform: none;
  }
}


/* Smooth hover animation */
.stat,
.template,
.ev {
  transition: transform 0.25s ease,
              border-color 0.25s ease,
              box-shadow 0.25s ease;
}

/* Lift cards on hover */
.stat:hover,
.template:hover,
.ev:hover {
  transform: translateY(-5px);
  border-color: var(--accent);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
  .stat,
  .template,
  .ev {
    transition: none;
  }

  .stat:hover,
  .template:hover,
  .ev:hover {
    transform: none;
  }
}

/* Templates cards hover */
#templatesGrid > *,
#templatesGrid .card {
  transition: transform 0.25s ease,
              border-color 0.25s ease,
              box-shadow 0.25s ease;
}

#templatesGrid > *:hover,
#templatesGrid .card:hover {
  transform: translateY(-5px);
  border-color: var(--accent);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
}

@media (prefers-reduced-motion: reduce) {
  #templatesGrid > *,
  #templatesGrid .card {
    transition: none;
  }

  #templatesGrid > *:hover,
  #templatesGrid .card:hover {
    transform: none;
  }
}
/* Cards and grids */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:16px;
}

.card{
  display:block;
  text-align:start;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
  overflow:hidden;
  width:100%;
  color:var(--ink);
}

button.card{
  cursor:pointer;
  font:inherit;
}

button.card:hover,.tool:hover{border-color:var(--accent)}

.ph{
  position:relative;
  aspect-ratio:16/10;
  background:var(--grad);
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:1.4rem;
  color:rgba(7,16,31,.75);
  overflow:hidden;
}

.ph img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.meta{
  padding:16px 18px;
  display:grid;
  gap:6px;
}

.meta>b{font-weight:600}
.meta span{color:var(--muted);font-size:.94rem}
.meta p{color:var(--muted);font-size:.94rem}

.tag{
  display:inline-block;
  justify-self:start;
  font-style:normal;
  font-size:.78rem;
  color:var(--accent);
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 10px;
  margin:5px 5px 0 0;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

/* Services */

.svc{
  padding:22px;
  border-inline-start:3px solid var(--a2);
}

.svc b,.tool b{
  font-weight:600;
  display:block;
  margin-bottom:5px;
}

.ev .row {
  justify-content: center;
}

.svc p,.tool p{
  color:var(--muted);
  font-size:.94rem;
}

.tool{padding:18px 20px}

/* Process */

/* Process: 3 steps on the first row, 2 on the second */


/* Tablet and mobile */


/* Templates and events */

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:8px;
}

.row .btn{
  padding:7px 14px;
  font-size:.9rem;
}

.two{display:grid;grid-template-columns:1fr 1fr}

.ev .two .ph{
  aspect-ratio:4/3;
  border-radius:0;
}

.tpl .meta{gap:9px}

/* Contact */

.contact a.big{
  display:inline-block;
  margin-top:8px;
  font-size:clamp(1.25rem,3vw,1.9rem);
  font-weight:700;
  background:var(--grad);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  overflow-wrap:anywhere;
}

.links{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
}

.links a:hover{color:var(--ink)}

/* Side stepper */

.side-stepper{
  position:fixed;
  z-index:15;
  inset-inline-end:22px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:13px;
  padding:13px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  background:rgba(10,15,28,.72);
  backdrop-filter:blur(12px);
}

.step-link{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  min-height:14px;
  color:var(--muted);
}

.step-dot{
  width:9px;
  height:9px;
  border:1px solid var(--muted);
  border-radius:50%;
  flex-shrink:0;
  transition:all .25s;
}

.step-label{
  font-size:.76rem;
  white-space:nowrap;
  opacity:0;
  max-width:0;
  overflow:hidden;
  transition:opacity .2s,max-width .2s;
}

.step-link:hover .step-label,
.step-link:focus-visible .step-label,
.step-link.active .step-label{
  opacity:1;
  max-width:150px;
}

.step-link.active .step-dot{
  background:var(--accent);
  border-color:var(--accent);
  box-shadow:0 0 12px rgba(56,189,248,.5);
  transform:scale(1.25);
}

.step-link.active{color:var(--ink)}

/* Footer */

footer{
  padding:24px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:.9rem;
  text-align:center;
}

/* Preview dialog */

dialog{
  margin:auto;
  width:min(960px,94vw);
  max-height:92vh;
  border:1px solid var(--line);
  border-radius:18px;
  background:#0F1626;
  color:var(--ink);
  padding:0;
}

dialog::backdrop{background:rgba(3,6,14,.8)}

dialog .top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
}

dialog .top b{font-weight:600}

dialog .body{
  padding:18px;
  overflow:auto;
  max-height:calc(92vh - 70px);
  display:grid;
  gap:14px;
}

dialog .body img{
  width:100%;
  border-radius:12px;
  display:block;
}

dialog iframe{
  width:100%;
  height:72vh;
  border:0;
  border-radius:12px;
  background:#fff;
}


.contact-section {
  padding-top: 60px;
  padding-bottom: 60px;
}

.contact-card {
  padding: clamp(24px, 5vw, 52px);
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 24px;
  background: linear-gradient(135deg, #111e32, #0b1424);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
}

.contact-intro {
  max-width: 620px;
  margin-bottom: 30px;
}

.contact-label {
  display: inline-block;
  margin-bottom: 14px;
  color: #8baeff;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
}

.contact-intro h2 {
  margin: 0 0 14px;
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.2;
}

.contact-intro p {
  max-width: 560px;
  margin: 0;
  color: #aebbd0;
  line-height: 1.8;
}

.contact-email {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  margin-bottom: 18px;
  border: 1px solid rgba(139, 174, 255, 0.22);
  border-radius: 16px;
  background: rgba(139, 174, 255, 0.07);
  color: inherit;
  text-decoration: none;
  transition: border-color 0.2s, transform 0.2s;
}

.contact-email:hover {
  border-color: #8baeff;
  transform: translateY(-2px);
}

.contact-icon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 12px;
  background: rgba(139, 174, 255, 0.13);
  color: #8baeff;
  font-size: 22px;
}

.contact-email > span:nth-child(2) {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.contact-email small {
  color: #94a6c1;
  font-size: 10px;
  letter-spacing: 1.5px;
}

.contact-email strong {
  overflow-wrap: anywhere;
  font-size: 16px;
}

.contact-arrow {
  margin-left: auto;
  color: #8baeff;
  font-size: 24px;
}

.contact-links {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.contact-link {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 16px;
  border: 1px solid rgba(148, 163, 184, 0.16);
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  transition: background 0.2s, border-color 0.2s;
}

.contact-link:hover {
  background: rgba(139, 174, 255, 0.06);
  border-color: rgba(139, 174, 255, 0.4);
}

.contact-link > span:first-child {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 10px;
  background: rgba(139, 174, 255, 0.1);
  color: #8baeff;
  font-size: 18px;
  font-weight: 700;
}

.contact-link > span:last-child {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.contact-link strong {
  font-size: 14px;
}

.contact-link small {
  color: #94a6c1;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.contact-footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 26px;
  padding-top: 20px;
  border-top: 1px solid rgba(148, 163, 184, 0.16);
  color: #94a6c1;
  font-size: 13px;
}

@media (max-width: 640px) {
  .contact-links {
    grid-template-columns: 1fr;
  }

  .contact-email {
    gap: 12px;
    padding: 15px;
  }

  .contact-email strong {
    font-size: 14px;
  }

  .contact-footer {
    flex-direction: column;
  }
}

/* Responsive */

@media(max-width:1100px){
  .side-stepper{inset-inline-end:8px}
  .side-stepper .step-label{display:none}
  .side-stepper{padding:12px 8px}
  .wrap{padding-inline:30px}
}

@media(max-width:860px){
  main>section.panel{padding:24px 0 20px}
  .panel-heading{margin-bottom:18px}

  .hero{
    grid-template-columns:1fr;
    gap:22px;
  }

  .photo{
    max-width:170px;
    justify-self:start;
    grid-row:1;
  }

  h1{max-width:22ch}

  .stats{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr;gap:14px}
  .steps li{padding-top:12px}
  .steps li::before{margin-bottom:8px}

  nav{gap:12px}
  nav a:not(.keep){display:none}

  .side-stepper{
    inset-inline-end:7px;
    gap:12px;
  }

  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}

@media(max-width:520px){
  .wrap{padding-inline:22px}
  main>section.panel{padding:20px 0 16px}
  .panel-heading{margin-bottom:16px}

  .stats{gap:10px}
  .stat{padding:13px}
  .stat span{font-size:.82rem}

  .grid{grid-template-columns:1fr}
  .side-stepper{display:none}

  .cta .btn{padding:9px 14px}
  .contact a.big{font-size:1.2rem}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;scroll-snap-type:none}
  *,*::before,*::after{transition:none!important}
}
</style>
</head>

<main>

<section id="home" class="panel home-section">
  <div class="wrap">
    <div class="hero">
      <div>
        <p class="role" data-t="Software Project Manager|مدير مشاريع برمجية"></p>

        <h1 data-t="I lead software projects from concept to launch.|قيادة المشاريع البرمجية من الفكرة إلى الإطلاق  ."></h1>

          <a class="btn" href="Mahmoud_Ahmed_Mohamed_PM.pdf" download data-t="Download CV|تحميل السيرة الذاتية"></a>
        </div>
      </div>

      <div class="photo">
        <img src="images/profile.jpg" alt="Portrait of Mahmoud Ghanem" width="1200" height="1500">
      </div>
    </div>

/* LANGUAGE */

var html = document.documentElement;
var modal = document.getElementById("modal");
var lang = "en";

try {
  lang = localStorage.getItem("portfolio-lang") || "en";
} catch (e) {}

function tr(value) {
  var parts = String(value).split("|");
  return parts[lang === "ar" ? 1 : 0] || parts[0];
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function placeholder(src, name) {
  return '<div class="ph">' + escapeHtml(name.charAt(0)) +
    '<img loading="lazy" src="' + escapeHtml(src) +
    '" alt="' + escapeHtml(name) +
    '" onerror="this.remove()"></div>';
}

function setHTML(id, content) {
  var element = document.getElementById(id);

  if (element) {
    element.innerHTML = content;
  }
}

function render() {
  html.lang = lang;
  html.dir = lang === "ar" ? "rtl" : "ltr";

  document.title = tr("Mahmoud Ghanem|محمود غانم") +
    " | " + tr("Software Project Manager|مدير مشاريع برمجية");

  document.querySelectorAll("[data-t]").forEach(function(element) {
    element.textContent = tr(element.dataset.t);
  });

  document.getElementById("lang").textContent =
    lang === "en" ? "العربية" : "English";

  document.getElementById("lang").setAttribute(
    "aria-label",
    lang === "en" ? "Switch to Arabic" : "Switch to English"
  );

  setHTML("steps", D.steps.map(function(step) {
    return "<li><b>" + tr(step[0]) + "</b><span>" +
      tr(step[1]) + "</span></li>";
  }).join(""));

  setHTML("projectsGrid", D.projects.map(function(project, index) {
    var tags = (project.tags || (project.tag ? [project.tag] : []))

        return '<i class="tag">' + tr(tag) + "</i>";
      }).join("");

    return '<button class="card" type="button" data-act="project" data-i="' +
      index + '">' +
      placeholder(project.images[0], project.name) +
      '<div class="meta"><b>' + escapeHtml(project.name) + '</b>' +
      '<span>' + tr(project.type) + '</span>' +
      '<div class="tags">' + tags + '</div></div></button>';

setHTML("eventsGrid", D.events.map(function(event, index) {

/* MODALS */

function openModal(title, content) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = content;
  modal.showModal();
}

document.addEventListener("click", function(event) {
  var button = event.target.closest("[data-act]");

  if (button) {
    var index = Number(button.dataset.i);

    if (button.dataset.act === "project") {
      var project = D.projects[index];

      if (project) {
        var images = project.images.map(function(src) {
          return '<img src="' + escapeHtml(src) +
            '" alt="' + escapeHtml(project.name) +
            '" loading="lazy" onerror="this.remove()">';
        }).join("");

        openModal(project.name + " — " + tr(project.type), images);
      }
    }

    if (button.dataset.act === "template") {
      var template = D.templates[index];

      if (template) {
        var isImage = /\.(png|jpe?g|webp|gif|svg)$/i.test(template.preview);

        var content = isImage
          ? '<img src="' + escapeHtml(template.preview) +
            '" alt="' + escapeHtml(tr(template.title)) + '">'
          : '<iframe src="' + escapeHtml(template.preview) +
            '" title="' + escapeHtml(tr(template.title)) + '"></iframe>';

        openModal(tr(template.title), content);
      }
    }
  }

  if (event.target === modal || event.target.id === "modalClose") {
    modal.close();
  }
});

modal.addEventListener("close", function() {
  document.getElementById("modalBody").innerHTML = "";
});

  render();
});

/* ACTIVE SECTION INDICATOR */

var sections = Array.from(document.querySelectorAll("main > section.panel"));
var stepLinks = Array.from(document.querySelectorAll(".step-link"));

function updateActiveSection() {
  var viewportPoint = window.innerHeight * 0.42;
  var currentSection = sections[0];

  sections.forEach(function(section) {
    var rect = section.getBoundingClientRect();

    if (rect.top <= viewportPoint && rect.bottom > viewportPoint) {
      currentSection = section;
    }
  });

  if (!currentSection) return;

  stepLinks.forEach(function(link) {
    var isActive = link.dataset.section === currentSection.id;

    link.classList.toggle("active", isActive);

    if (isActive) {
      link.setAttribute("aria-current", "location");
    } else {
      link.removeAttribute("aria-current");
    }
  });
}

if ("IntersectionObserver" in window) {
  var sectionObserver = new IntersectionObserver(function() {
    updateActiveSection();
  }, {
    root: null,
    threshold: [0, 0.15, 0.3, 0.5, 0.7]
  });

  sections.forEach(function(section) {
    sectionObserver.observe(section);
  });
}

window.addEventListener("scroll", updateActiveSection, {passive:true});
window.addEventListener("resize", updateActiveSection);

stepLinks.forEach(function(link) {
  link.addEventListener("click", function(event) {
    var target = document.querySelector(link.getAttribute("href"));

    if (target) {
      event.preventDefault();

      target.scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "auto"
          : "smooth",
        block: "start"
      });
    }
  });
});

/* INITIAL RENDER */

render();
</script>
